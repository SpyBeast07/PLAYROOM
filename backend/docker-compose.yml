services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: playroom-backend:latest
    container_name: playroom-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18787}:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,https://playroom-chi.vercel.app}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
